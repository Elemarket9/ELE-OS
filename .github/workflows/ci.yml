# Host checks only. This workflow does not sync AOSP, build an image,
# boot Cuttlefish, or receive a release key. Development images use the
# public AOSP test key named in ele_os_cf_build.mk.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the host toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ libssl-dev

      - name: Run host tests
        run: CXX=g++ sh tests/run.sh

      - name: Check the build contract
        run: sh tests/check-build-contract.sh

  peripherals-sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test USB descriptor classification
        run: sh tests/peripheral-kinds.sh
      - name: Compile external devices app against Android 36
        run: |
          manager="${ANDROID_HOME:?Android SDK not set}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          "$manager" "platforms;android-36" "build-tools;36.0.0"
          ELE_API=36 ELE_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0" sh tests/peripherals-sdk.sh "$RUNNER_TEMP/peripherals-sdk"

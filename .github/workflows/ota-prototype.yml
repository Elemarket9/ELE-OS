name: ota-prototype

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the compiler and OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y g++ libssl-dev
      - name: Run host tests
        run: CXX=g++ sh tests/run.sh
